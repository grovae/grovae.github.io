        try { const src = await (await fetch(`https://raw.githubusercontent.com/${owner}/${repo.name}/${repo.default_branch}/${p}`)).text();
              if (/<meta[^>]+name=["']grovae-links["'][^>]+content=["']hide/i.test(src)) continue;
              const m = src.match(/<title[^>]*>([\s\S]*?)<\/title>/i); if (m) { const el=document.createElement('textarea'); el.innerHTML=m[1]; title=el.value.replace(/\s+/g,' ').trim(); } } catch(e){}
        const clean = p.endsWith('index.html') ? p.slice(0,-10) : p;
        added.push(enrich({client: clientName(repo.name), repo: repo.name, path: p, title, desc:'', isNew:true,
          type: classify(repo.name, p, title), url: repo.name===CFG.user_site_repo ? site+clean : `${site}${repo.name}/${clean}`,
          updated: repo.pushed_at, created: repo.pushed_at}));
      }
    }
    if (added.length){ items = [...added, ...items].sort((a,b)=>b.d-a.d); render(); }
  } catch(e){}
}
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const state = {q:'', client:'All', type:'All'};
try { const s = JSON.parse(sessionStorage.getItem('gl-state')||'null'); if (s) Object.assign(state, s); } catch(e){}

function fmt(d){
  const now = new Date(), days = Math.floor((now - d)/864e5);
  const abs = d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  const rel = days<=0 ? 'today' : days===1 ? 'yesterday' : days<31 ? days+'d ago' : '';
  return rel ? `<b>${rel}</b> · ${abs}` : abs;
}
function hl(text, terms){
  let out = esc(text);
  terms.forEach(t => { if (t.length>1) out = out.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>'); });
  return out;
}
function row(it, terms, showClient){
  const tag = (showClient ? `<span class="tag">${esc(it.client)}</span>` : '') + (it.isNew ? `<span class="tag" style="color:#B5482F;background:#FBECE7">new</span>` : '');
  const typeTag = showClient ? `<span class="tag">${esc(it.type)}</span>` : '';
  const created = (it.c.toDateString() !== it.d.toDateString()) ? ` · first published ${it.c.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}` : '';
  return `<a class="row" href="${esc(it.url)}" target="_blank" rel="noopener">
    <div class="t">${hl(it.title, terms)}${tag}${typeTag}<small>${esc(it.url.replace('https://',''))}${created}</small></div>
    <div class="d">${fmt(it.d)}</div></a>`;
}
function chips(){
  const base = items.filter(it => state.type==='All' || it.type===state.type);
  const counts = {}; base.forEach(it => counts[it.client]=(counts[it.client]||0)+1);
  const clients = Object.keys(counts).sort((a,b)=> a.localeCompare(b));
  $('clients').innerHTML = ['All',...clients].map(c =>
    `<button class="chip ${state.client===c?'on':''}" data-c="${esc(c)}">${esc(c)}<span>${c==='All'?base.length:counts[c]}</span></button>`).join('');
  const base2 = items.filter(it => state.client==='All' || it.client===state.client);
  const tc = {}; base2.forEach(it => tc[it.type]=(tc[it.type]||0)+1);
  $('types').innerHTML = ['All',...DATA.types.filter(t=>tc[t])].map(t =>
    `<button class="chip ${state.type===t?'on':''}" data-t="${esc(t)}">${t==='All'?'All types':esc(t)}<span>${t==='All'?base2.length:tc[t]}</span></button>`).join('');
}
let topHit = null;
function render(){
  try { sessionStorage.setItem('gl-state', JSON.stringify(state)); } catch(e){}
  chips();
  const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  let list = items.filter(it => (state.client==='All'||it.client===state.client) && (state.type==='All'||it.type===state.type)
    && terms.every(t => it.hay.includes(t)));
  let h = '';
  if (!list.length){ $('list').innerHTML = '<p class="empty">Nothing matches. Try a client name, a month, or a word from the title.</p>'; topHit=null; return; }
  if (terms.length){
    list.sort((a,b) => { const s = x => terms.filter(t=>x.title.toLowerCase().includes(t)).length; return s(b)-s(a) || b.d-a.d; });
    h += `<h2>Results <span class="n">${list.length}</span></h2>` + list.map(it=>row(it,terms,true)).join('');
  } else {
    if (state.client==='All' && state.type==='All'){
      h += `<h2>Recently updated</h2>` + list.slice(0,6).map(it=>row(it,[],true)).join('');
    }
    const byClient = {};
    list.forEach(it => (byClient[it.client] = byClient[it.client] || []).push(it));
    const order = Object.keys(byClient).sort((a,b)=> byClient[b][0].d - byClient[a][0].d);
    order.forEach(c => {
      const its = byClient[c];
      const hub = items.find(x => x.client===c && x.type==='Client hub');
      const name = hub ? `<a href="${esc(hub.url)}" target="_blank" rel="noopener">${esc(c)}</a>` : esc(c);
      h += `<h2>${name} <span class="n">${its.length}</span></h2>`;
      DATA.types.forEach(t => {
        const g = its.filter(x => x.type===t);
        if (!g.length) return;
        h += `<h3>${esc(t)} · ${g.length}</h3>` + g.map(it=>row(it,[],false)).join('');
      });
    });
  }
  $('list').innerHTML = h;
  topHit = list[0];
}
$('q').value = state.q;
$('q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('q').addEventListener('keydown', e => {
  if (e.key==='Enter' && topHit) window.open(topHit.url, '_blank');
  if (e.key==='Escape'){ state.q=''; e.target.value=''; render(); }
});
document.addEventListener('keydown', e => { if (e.key==='/' && document.activeElement!==$('q')){ e.preventDefault(); $('q').focus(); } });
$('clients').addEventListener('click', e => { const b=e.target.closest('[data-c]'); if(!b) return; state.client=b.dataset.c; render(); });
$('types').addEventListener('click', e => { const b=e.target.closest('[data-t]'); if(!b) return; state.type=b.dataset.t; render(); });
const nClients = new Set(items.map(i=>i.client)).size;
$('sub').innerHTML = `${items.length} pages across ${nClients} clients · updates itself whenever anything is published`;
$('foot').innerHTML = `Last rebuilt ${new Date(DATA.built).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} · <kbd>/</kbd> search · <kbd>Enter</kbd> open top match · <kbd>Esc</kbd> clear`;
render();
topUp();
</script>
</body>
</html>
